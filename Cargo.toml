[package]
name = "sharey"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.21.4"
mime_guess = "2.0.4"
pest = "2.7.3"
pest_derive = "2.7.3"
rand = "0.8.5"
regex = "1.13.1"
reqwest = { version = "0.11.20", features = ["stream", "multipart", "json", "blocking"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "1.0.48"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
